<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umar Abdul Azis · Senior Product Designer</title>
<meta name="description" content="Umar Abdul Azis, UI/UX designer for SaaS products, AI tools, and landing pages. Based in Yogyakarta, Indonesia.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- navigasi teks untuk screen reader & crawler, tidak terlihat -->
  <nav class="sr-only" aria-label="Main">
    <ul>
      <li><a href="#/">Home</a></li>
      <li><a href="#/about">About</a></li>
    </ul>
  </nav>

  <div id="app" class="app">
    <!-- kolom kiri: identitas + aksi. Tetap di tempat lintas halaman -->
    <aside class="rail" id="rail"></aside>

    <!-- kolom kanan: panggung. Isinya berganti per halaman -->
    <main class="stage" id="stage" tabindex="-1"></main>

    <!-- indikator titik di tepi kanan, hanya di home -->
    <div class="dots" id="dots" hidden></div>
  </div>

  <!-- globe-data.js dan globe.js sengaja tidak dimuat di sini. Keduanya
       hanya dipakai halaman about, jadi diambil saat halaman itu dibuka.
       Lihat ensureGlobe() di app.js. -->
  <!-- latar ASCII dari foto diri, lihat ascii-bg.js -->
  <script src="ascii-bg.js" defer></script>
  <script src="sound.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
