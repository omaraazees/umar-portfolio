<title>AI Headshots · demo stage</title>
<!--
  Panggung video demo AI Headshots untuk portfolio.
  ?comp=cover|desktop|mobile|landing|mlanding   pilih komposisi
  ?render=1                                  dikendalikan render.js lewat window.render(t)
  Tanpa render=1 halaman memutar sendiri (preview).
-->
<style>
  html, body { margin: 0; background: #F6F6F6; }
  #stage {
    position: relative; overflow: hidden;
    width: var(--W); height: var(--H);
    /* rata, sama persis dengan --bg situs, supaya video menyatu dengan halaman */
    background: #F6F6F6;
  }
  .cam { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 50%; }
  .world { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
  .grp { position: absolute; left: 0; top: 0; transform-style: preserve-3d; }
  .el { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform, opacity; }

  /* Jendela browser bergaya skeuomorph minimalis, satu bahan dengan iPhone
     clay: layar duduk di dalam bingkai putih susu bergradasi yang tepinya
     tersorot di atas dan sedikit cekung di bawah. Bingkainya digambar lewat
     ::before di luar kotak, jadi ukuran dan koordinat jendela tidak berubah. */
  .win { border-radius: 14px; background: #fff;
    box-shadow: 0 0 0 1px rgba(17, 17, 17, .08), 0 0 0 3px rgba(255, 255, 255, .7); }
  .win::before { content: ""; position: absolute; inset: -9px; z-index: -1; border-radius: 23px;
    background: linear-gradient(160deg, #FDFDFC 0%, #F3F3F1 55%, #E9E9E6 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .9), inset 0 2px 3px rgba(255, 255, 255, .9), inset 0 -4px 10px rgba(17, 17, 17, .06),
      0 0 0 1px rgba(17, 17, 17, .05), 0 2px 4px rgba(17, 17, 17, .05), 0 14px 28px -10px rgba(17, 17, 17, .10), 0 44px 90px -30px rgba(17, 17, 17, .20); }
  .win .bar { height: 30px; background: linear-gradient(180deg, #FAFAF9 0%, #F2F2F0 100%); border-bottom: 1px solid rgba(17, 17, 17, .06);
    border-radius: 14px 14px 0 0; display: flex; gap: 7px; align-items: center; padding-left: 15px; }
  /* lampu jendela cekung ke dalam bahan */
  .win .bar i { width: 10px; height: 10px; border-radius: 50%; background: #E4E4E1;
    box-shadow: inset 0 1px 1.5px rgba(17, 17, 17, .14), 0 .5px 0 rgba(255, 255, 255, .9); }
  .win .view { border-radius: 0 0 14px 14px; }
  .win img, .phone img, .tile img { display: block; width: 100%; height: auto; }

  .phone {
    border-radius: 42px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1px rgba(17, 17, 17, .06), 0 1px 2px rgba(17, 17, 17, .04), 0 10px 20px -6px rgba(17, 17, 17, .08), 0 40px 80px -24px rgba(17, 17, 17, .18);
  }
  .phone .scr { position: relative; }
  .phone .scr img { position: absolute; left: 0; top: 0; }
  .phone .scr img:first-child { position: relative; }

  .tile { border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1px rgba(17, 17, 17, .05), 0 1px 2px rgba(17, 17, 17, .05), 0 10px 22px -10px rgba(17, 17, 17, .12), 0 30px 56px -26px rgba(17, 17, 17, .16); }
  .tile::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .8), inset 0 0 0 1px rgba(255, 255, 255, .25); }

  /* layar yang bisa dipakai: lapisan layar + overlay state dalam piksel desain */
  @font-face { font-family: Gilroy; font-weight: 400; src: url("../../../Pen.dev/Resumedone/Gilroy-Regular.otf"); }
  @font-face { font-family: Gilroy; font-weight: 500; src: url("../../../Pen.dev/Resumedone/Gilroy-Medium.otf"); }
  @font-face { font-family: Gilroy; font-weight: 600; src: url("../../../Pen.dev/Resumedone/Gilroy-SemiBold.otf"); }
  @font-face { font-family: Gilroy; font-weight: 700; src: url("../../../Pen.dev/Resumedone/Gilroy-Bold.otf"); }
  .view { position: relative; overflow: hidden; background: #fff; }
  .ds { position: absolute; left: 0; top: 0; transform-origin: 0 0; font-family: Gilroy, sans-serif; }
  .lay { position: absolute; inset: 0; }
  .win .lay > img, .iph .lay > img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .ov { position: absolute; box-sizing: border-box; }
  .ov.en { overflow: hidden; filter: url(#en); }
  .ov.en img, .ov.crop img { max-width: none; }
  .ov.crop { overflow: hidden; }
  .ov.ring { border: 2px solid #1688FE; border-radius: 9px; }
  .ov.radio { border-radius: 50%; background: #fff; border: 1.5px solid #1688FE; display: grid; place-items: center; }
  .ov.radio i { width: 10px; height: 10px; border-radius: 50%; background: #1688FE; }
  .ov.chk { border-radius: 4px; background: #1688FE; }
  .ov.photo { border-radius: 10px; background: url("screens/selfie.jpg") center 30% / cover; }
  .ov.focus { border: 1.5px solid #1688FE; border-radius: 8px; box-shadow: 0 0 0 3px rgba(22, 136, 254, .18); }
  .ov.typed { display: flex; align-items: center; padding-left: 5px; color: #181818; white-space: nowrap; }
  .ov.typed b { width: 1.2px; height: 17px; margin-left: 1px; background: #181818; }
  .ov.fill { border-radius: 4px; background: #1688FE; }
  .ov.pct { background: #fff; color: #404040; font-weight: 500; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; }
  .ov.count { background: #fff; color: #737373; display: flex; align-items: center; justify-content: flex-end; white-space: nowrap; }
  .ov.cur { left: 0; top: 0; width: 28px; height: 36px; margin: -3px 0 0 -3px; transform-origin: 3px 3px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .28)); }
  .ov.rip { left: -40px; top: -40px; width: 80px; height: 80px; border-radius: 50%; background: rgba(22, 136, 254, .35); }
  .ov.tap { left: -23px; top: -23px; width: 46px; height: 46px; border-radius: 50%; background: rgba(17, 24, 39, .32); border: 1.5px solid rgba(255, 255, 255, .8); box-shadow: 0 2px 8px rgba(17, 24, 39, .18); }

  /* iPhone */
  /* bingkai clay putih, senada dengan portfolio: badan putih susu bergradasi,
     sorotan di tepi atas, sedikit cekung di tepi bawah, bayangan lembut */
  .iph .body { position: absolute; left: 0; top: 0; width: 412px; height: 866px; transform-origin: 0 0; border-radius: 58px;
    background: linear-gradient(160deg, #FDFDFC 0%, #F1F1EE 55%, #E6E6E2 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .9), inset 0 2px 3px rgba(255, 255, 255, .9), inset 0 -4px 10px rgba(17, 17, 17, .06),
      0 0 0 1px rgba(17, 17, 17, .05), 0 2px 4px rgba(17, 17, 17, .05), 0 14px 28px -10px rgba(17, 17, 17, .10), 0 44px 90px -30px rgba(17, 17, 17, .20); }
  /* lekuk tipis di sekeliling layar supaya bezelnya terbaca sebagai benda */
  .iph .scrn { box-shadow: 0 0 0 1px rgba(17, 24, 39, .08), 0 0 0 3px rgba(255, 255, 255, .7); }
  .iph .scrn { position: absolute; left: 11px; top: 11px; width: 390px; height: 844px; border-radius: 47px; overflow: hidden; background: #fff; }
  /* dynamic island abu clay, senada dengan bingkai, sedikit cekung */
  .iph .island { position: absolute; left: 146px; top: 22px; width: 120px; height: 35px; border-radius: 20px;
    background: linear-gradient(180deg, #E3E3E0 0%, #ECECE9 100%); box-shadow: inset 0 1px 2px rgba(17, 24, 39, .1), 0 0.5px 0 rgba(255, 255, 255, .8); }
  .sb { position: absolute; left: 0; top: 0; width: 390px; height: 47px; background: #fff; color: #111; font: 600 16.5px system-ui, sans-serif; }
  .sb b { position: absolute; left: 0; width: 135px; top: 17px; text-align: center; font-weight: 600; letter-spacing: -.01em; }
  .sb span { position: absolute; right: 0; width: 135px; top: 20px; display: flex; gap: 6px; justify-content: center; align-items: center; }
  .saf { position: absolute; left: 0; top: 711px; width: 390px; height: 133px; background: #F3F3F5; box-shadow: 0 -.5px 0 #D5D5DA; font: 400 16.5px system-ui, sans-serif; color: #111; }
  .saf .url { position: absolute; left: 16px; top: 9px; width: 358px; height: 44px; border-radius: 12px; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .1);
    display: flex; align-items: center; justify-content: space-between; padding: 0 13px; box-sizing: border-box; }
  .saf .url u { text-decoration: none; font-size: 15px; letter-spacing: -.02em; }
  .saf .url span { display: flex; gap: 6px; align-items: center; }
  .saf .tb { position: absolute; left: 14px; top: 62px; width: 362px; height: 44px; display: flex; justify-content: space-between; align-items: center; }
  .saf .tb svg { width: 25px; height: 25px; fill: none; stroke: #007AFF; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .scrn > i.hi { position: absolute; left: 128px; bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #111; z-index: 2; }
  .saf > i { position: absolute; left: 128px; top: 120px; width: 134px; height: 5px; border-radius: 3px; background: #111; }
  /* slider before/after */
  .ov.lepas { background: #fff; box-shadow: inset 0 0 0 1px #e3e3e4; }
  .ov.pilih { box-shadow: inset 0 0 0 2px #1688FE; }
  .ov.tutup { background: #fff; }
  .ov.chipsel { border-radius: 999px; background: rgb(232, 242, 255); color: #1688FE; font-weight: 500; display: flex; align-items: center; padding-left: 28px; white-space: nowrap; }
  .ov.cmp { overflow: hidden; background: #737373; }
  .cmp .in { position: absolute; left: 0; top: 0; width: 489px; height: 520px; transform-origin: 0 0; }
  .cmp img { position: absolute; max-width: none; width: 488px; height: 520px; }
  .cmp .ai { left: 1.5px; top: 0; }
  .cmp .sf { position: absolute; left: 0; top: 0; height: 520px; overflow: hidden; }
  .cmp .sf img { left: .5px; top: 3px; }
  .cmp .in > i { position: absolute; top: 0; width: 4px; height: 520px; background: #fff; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="en" color-interpolation-filters="sRGB"><feComponentTransfer>
  <feFuncR type="linear" slope="1.9915" intercept="-0.9915"/><feFuncG type="linear" slope="1.9833" intercept="-0.9833"/><feFuncB type="linear" slope="1" intercept="0"/>
</feComponentTransfer></filter></svg>
<div id="stage"><div class="cam"><div class="world" id="world"></div></div></div>
<script>
const Q = new URLSearchParams(location.search);
const COMP = Q.get("comp") || "desktop";
const RENDER = Q.get("render") === "1";

const D = "screens/desktop/", M = "screens/mobile/";
const SCR = {
  landing: D + "r4rJr.png", gender: D + "BJqwc.png", outfits: D + "EaOpi.png", background: D + "Q5f1V.png",
  upload: D + "kwWTC.png", account: D + "DZdwj.png", paywall: D + "cFFJA.png", payment: D + "lZ1Es.png",
  preparing: D + "xU9Ux.png", results: D + "qX4Jo.png", library: D + "l0MBQ8.png",
  mLanding: M + "u7PYv.png", mGender: M + "HKS7B.png", mOutfits: M + "W7BPnM.png", mBackground: M + "bUSl6.png",
  mUpload: M + "TPll4.png", mPaywall: M + "oSjmm.png", mPreparing: M + "RPOyL.png", mResults: M + "TTRmk.png", mLibrary: M + "uZVWw.png"
};

/* ---------- waktu dan easing ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  io: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  out: x => 1 - Math.pow(1 - x, 3),
  quint: x => x < .5 ? 16 * x ** 5 : 1 - Math.pow(-2 * x + 2, 5) / 2,
  sine: x => -(Math.cos(Math.PI * x) - 1) / 2,
  lin: x => x
};
/* K(t, [[t0,v0],[t1,v1],...], easing) : nilai di antara kunci, easing per segmen */
function K(t, keys, e = E.quint) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [t1, v1] = keys[i], [t0, v0] = keys[i - 1];
    if (t <= t1) { const p = e(seg(t, t0, t1)); return lerp(v0, v1, p); }
  }
  return keys[keys.length - 1][1];
}

/* ---------- elemen ---------- */
const world = document.getElementById("world");
const stage = document.getElementById("stage");
function mk(cls, parent = world) { const d = document.createElement("div"); d.className = cls; parent.appendChild(d); return d; }
function win(src, w, ratio = 900 / 1920) {
  const el = mk("el win"); el.style.width = w + "px";
  el.innerHTML = `<div class="bar"><i></i><i></i><i></i></div><img src="${src}">`;
  el._w = w; el._h = 30 + w * ratio; return el;
}
function phone(srcs, w) {
  const el = mk("el phone"); el.style.width = w + "px";
  el.innerHTML = `<div class="scr">${srcs.map(s => `<img src="${s}">`).join("")}</div>`;
  el._w = w; el._h = w * 1992 / 1170; el._imgs = [...el.querySelectorAll("img")]; return el;
}
/* letakkan elemen: titik tengahnya di (x,y,z) ruang dunia */
function put(el, o) {
  const { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, s = 1, op = 1 } = o;
  el.style.transform = `translate3d(${x - el._w / 2}px,${y - el._h / 2}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;
  el.style.opacity = op;
  el.style.visibility = op <= 0.001 ? "hidden" : "visible";
}
/* kamera: zoom s ke titik (px,py) dunia, plus putaran ringan */
function cam(o) {
  const { s = 1, px = 0, py = 0, rx = 0, ry = 0, z = 0 } = o;
  world.style.transform = `translateZ(${z}px) rotateX(${rx}deg) rotateY(${ry}deg) scale(${s}) translate(${-px}px,${-py}px)`;
}
/* titik pada layar desktop: fx,fy = fraksi gambar (0..1), relatif ke pusat jendela */
const pt = (el, fx, fy) => [(fx - .5) * el._w, -el._h / 2 + 30 + fy * (el._h - 30)];

/* ---------- komposisi ---------- */
const COMPS = {};

/* ---------- aplikasi yang bisa dipakai: satu jendela atau satu HP berisi tumpukan layar ----------
   Semua koordinat di dalam layar memakai piksel desain (desktop 1920 x 900, mobile 390 x 664). */
/* HP digambar sebagai iPhone 390 x 844: status bar 47, area web 664, bilah Safari 133 */
const STATUS = `<div class="sb"><b>9:41</b><span>
  <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="5.5" width="3" height="6.5" rx=".8"/><rect x="10" y="3" width="3" height="9" rx=".8"/><rect x="15" y="0" width="3" height="12" rx=".8"/></svg>
  <svg viewBox="0 0 17 12" width="17" height="12"><path d="M8.5 2.6c2.3 0 4.4.9 6 2.4l1.1-1.2C13.700 2 11.200.9 8.500.9S3.300 2 1.400 3.800L2.500 5c1.600-1.500 3.700-2.400 6-2.400zm0 3.400c1.400 0 2.700.5 3.700 1.400l1.100-1.200c-1.300-1.200-3-1.900-4.800-1.900s-3.500.7-4.800 1.900l1.100 1.200c1-.9 2.300-1.400 3.700-1.400zm0 3.300c-.7 0-1.300.3-1.800.700l1.800 1.900 1.800-1.900c-.5-.4-1.100-.7-1.800-.7z"/></svg>
  <svg viewBox="0 0 27 13" width="27" height="13"><rect x=".5" y=".5" width="22" height="12" rx="3.6" fill="none" stroke="#111" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.2"/><path d="M24 4.500v4c.8-.3 1.500-1.100 1.500-2s-.7-1.700-1.500-2z" opacity=".45"/></svg>
</span></div>`;
const SAFARI = `<div class="saf"><div class="url"><u>AA</u><span><svg viewBox="0 0 10 13" width="9" height="12"><path d="M2.500 5.500V4a2.500 2.500 0 0 1 5 0v1.500h.5a1 1 0 0 1 1 1V11a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V6.500a1 1 0 0 1 1-1zm1.200 0h2.600V4a1.300 1.300 0 0 0-2.600 0z" fill="#111"/></svg>cv-lite.com</span>
  <svg viewBox="0 0 20 20" width="19" height="19"><path d="M15.500 10a5.500 5.500 0 1 1-1.600-3.900M14.500 2.800v3.600h-3.600" fill="none" stroke="#111" stroke-width="1.600" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="tb">
  <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><svg viewBox="0 0 24 24" opacity=".3"><path d="M9 5l7 7-7 7"/></svg>
  <svg viewBox="0 0 24 24"><path d="M12 15V3.500M8 7l4-4 4 4M7 10.500H6a1.500 1.500 0 0 0-1.500 1.500v7.500A1.500 1.500 0 0 0 6 21h12a1.500 1.500 0 0 0 1.500-1.500V12a1.500 1.500 0 0 0-1.500-1.500h-1"/></svg>
  <svg viewBox="0 0 24 24"><path d="M12 6.500C10.500 5.200 8.300 4.500 5 4.500c-.6 0-1 .4-1 1V17c0 .6.400 1 1 1 3.300 0 5.500.7 7 2 1.500-1.300 3.700-2 7-2 .6 0 1-.4 1-1V5.500c0-.6-.4-1-1-1-3.300 0-5.500.7-7 2zm0 0V20"/></svg>
  <svg viewBox="0 0 24 24"><rect x="8.500" y="3.500" width="12" height="12" rx="2.500"/><path d="M15.500 18.500v.5a1.500 1.500 0 0 1-1.500 1.500H5A1.500 1.500 0 0 1 3.500 19v-9A1.500 1.500 0 0 1 5 8.500h.5"/></svg>
  </div><i></i></div>`;
function app(kind, list, W, tall, o = {}) {
  /* o.dw: lebar desain jendela (bawaan 1920). o.vh: HP tanpa bilah Safari dengan
     tinggi layar sendiri, untuk layar aplikasi yang didesain penuh 390 x vh. */
  const ph = kind === "phone", DW = ph ? 390 : o.dw || 1920, DH = tall || (ph ? o.vh || 664 : 900), bar = ph ? 0 : 30;
  const sh = ph ? (o.vh ? 47 + o.vh : 844) : 0, k = W / (ph ? 412 : DW);
  const el = mk("el " + (ph ? "iph" : "win")); el.style.width = W + "px";
  el.innerHTML = ph
    ? `<div class="body" style="transform:scale(${k});height:${sh + 22}px"><div class="scrn" style="height:${sh}px">${STATUS}<div class="view" style="position:absolute;left:0;top:47px;width:390px;height:${DH}px"><div class="ds" style="width:390px;height:${DH}px"></div></div>${o.vh ? '<i class="hi"></i>' : SAFARI}</div><div class="island"></div></div>`
    : `<div class="bar"><i></i><i></i><i></i></div><div class="view" style="height:${DH * k}px"><div class="ds" style="width:${DW}px;height:${DH}px;transform:scale(${k})"></div></div>`;
  const ds = el.querySelector(".ds");
  Object.assign(el, { _w: W, _h: ph ? (sh + 22) * k : bar + DH * k, _bar: bar, _k: k, _DW: DW, _DH: DH, L: {}, order: [] });
  for (const [key, src] of list) { const d = mk("lay", ds); d.innerHTML = `<img src="${src}">`; d._src = src; el.L[key] = d; el.order.push(key); }
  el.fx = mk("lay", ds);
  return el;
}
/* slider before/after di hero: dua foto utuh, pembatas, kenop, dan dua chip yang
   memudar saat tertabrak pembatas. Ukuran dasar 489 x 520 (desktop), k menskalakannya. */
function compare(layer, x, y, k, DW, PH) {
  const c = ov(layer, "cmp", x, y, 489 * k, 520 * k,
    `<div class="in" style="transform:scale(${k})"><img class="ai" src="screens/full/hero/ai.jpg"><div class="sf"><img src="screens/full/hero/selfie.jpg"></div><i></i></div>`);
  c.style.borderRadius = 4 * k + "px";
  const P0 = 244.5, at = (rx, ry, w, h, r) => {
    const e = piece(layer, layer._src, x + rx * k, y + ry * k, w * k, h * k, x + rx * k, y + ry * k, DW, PH); e.style.borderRadius = r * k + "px"; return e;
  };
  const o = { x, k, sf: c.querySelector(".sf"), ln: c.querySelector("i"), chipL: at(17.5, 16, 70, 28, 8), chipR: at(350.5, 16, 121, 28, 8), knob: at(224.5, 240, 40, 40, 20) };
  o.set = P => {
    o.sf.style.width = P + "px"; o.ln.style.left = P - 2 + "px"; o.knob.style.transform = `translateX(${(P - P0) * k}px)`;
    fade(o.chipL, clamp((P - 75) / 30)); fade(o.chipR, clamp((365 - P) / 30));
  };
  o.toP = px => clamp((px - x) / k, 24, 465);
  o.set(P0); return o;
}
function ov(layer, cls, x, y, w, h, html = "") {
  const d = mk("ov " + cls, layer);
  Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  d.innerHTML = html; return d;
}
/* tombol pucat jadi aktif: potongan layar yang sama, warnanya dipetakan ke biru penuh */
function enable(layer, x, y, w, h, DW, DH) {
  return ov(layer, "en", x, y, w, h, `<img src="${layer._src}" style="position:absolute;left:${-x}px;top:${-y}px;width:${DW}px;height:${DH}px">`);
}
/* potongan layar lain yang ditempel di layar ini, misalnya thumbnail yang sudah jadi */
function piece(layer, src, x, y, w, h, sx, sy, DW, DH) {
  return ov(layer, "crop", x, y, w, h, `<img src="${src}" style="position:absolute;left:${-sx}px;top:${-sy}px;width:${DW}px;height:${DH}px">`);

/* salin tepi kotak "dari" ke kotak "ke" (ukuran sama), m = lebar tepi yang ikut disalin
   termasuk cahaya fokus di luar garis. Dipakai untuk memindah fokus antar field
   tanpa mengarang gaya: tepi field fokus dan tepi field biasa diambil dari layar. */
function tepiSalin(layer, src, dari, ke, m, DW, DH) {
  const [fx, fy, w, h] = dari, [tx, ty] = ke;
  return [[-m, -m, w + 2 * m, 2 * m], [-m, h - m, w + 2 * m, 2 * m], [-m, m, 2 * m, h - 2 * m], [w - m, m, 2 * m, h - 2 * m]]
    .map(([dx, dy, ww, hh]) => piece(layer, src, tx + dx, ty + dy, ww, hh, fx + dx, fy + dy, DW, DH));
}
/* kata sandi diketik: penutup placeholder, titik-titik, caret */
function sandi(layer, x, y, w, fs) {
  const cov = ov(layer, "tutup", x - 2, y - 13, w, 26);
  const el = ov(layer, "typed", x - 5, y - 13, w, 26, "<span></span><b></b>");
  el.style.fontFamily = "Gilroy, sans-serif"; el.style.fontSize = fs + "px"; el.style.letterSpacing = ".12em"; el.style.color = "#1D1D1F";
  return { cov, el, set(k, caret) { fade(cov, k > 0 || caret ? 1 : 0); fade(el, k > 0 || caret ? 1 : 0); el.firstChild.textContent = "•".repeat(k); fade(el.lastChild, caret ? 1 : 0); } };
}

/* COVER 1080 x 1080, 8 detik, loop mulus: dinding layar miring yang bergeser pelan */
COMPS.cover = {
  W: 1080, H: 1080, DUR: 8,
  build() {
    const order = ["landing", "outfits", "results", "paywall", "library", "gender", "preparing", "background", "account", "upload", "payment"];
    this.walls = [0].map(() => {
      const g = mk("grp"); g.style.transformStyle = "preserve-3d";
      const TW = 520, TH = TW * 900 / 1920, GX = 36, GY = 36, cols = 5, rows = 7;
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const k = order[(r * 2 + c * 3) % order.length];
        const el = mk("el tile", g); el.style.width = TW + "px"; el.innerHTML = `<img src="${SCR[k].replace("desktop/", "desktop-sm/").replace(".png", ".jpg")}">`;
        el._w = TW; el._h = TH;
        el._base = { x: (c - (cols - 1) / 2) * (TW + GX) + (r % 2) * (TW + GX) / 2, y: (r - (rows - 1) / 2) * (TH + GY) };
        put(el, el._base);
      }
      g._tiles = [...g.querySelectorAll(".tile")];
      g._period = TH + GY;
      return g;
    });
    /* ubin hero: ubin landing yang paling dekat ke pusat dinding */
    const tiles = this.walls[0]._tiles;
    let best = null, bd = 1e9;
    tiles.forEach(el => { if (!/r4rJr/.test(el.innerHTML)) return; const d = Math.hypot(el._base.x, el._base.y); if (d < bd) { bd = d; best = el; } });
    this.hero = best || tiles[Math.floor(tiles.length / 2)];
  },
  render(t) {
    /* Gerak melayang melingkar: posisi di detik 8 sama dengan detik 0, jadi loop
       mulus tanpa crossfade. Satu ubin di tengah terangkat pelan lalu turun lagi. */
    const D = this.DUR, a = (t / D) * Math.PI * 2;
    const g = this.walls[0];
    g.style.transform = `rotateX(46deg) rotateZ(${-24 + Math.sin(a) * 1.2}deg) translate3d(${Math.sin(a) * 90}px,${-Math.cos(a) * 70 + 70}px,0)`;
    const lift = Math.sin(Math.PI * seg(t, 1.2, 6.8)) ** 2;
    const hero = this.hero;
    put(hero, { ...hero._base, z: lift * 70, s: 1 + lift * .04 });
    hero.style.boxShadow = `0 0 0 1px rgba(17,24,39,.06), 0 ${18 + lift * 30}px ${40 + lift * 50}px rgba(17,24,39,${.10 + lift * .08})`;
    cam({ s: 1.18 });
  }
};
