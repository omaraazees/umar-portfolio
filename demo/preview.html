<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview demo AI Headshots</title>
<style>
  :root { --bg: #F6F6F6; --ink: #111; --ink-3: #A3A3A3; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 Inter, "Helvetica Neue", system-ui, sans-serif; }
  main { max-width: 1480px; margin: 0 auto; padding: 48px 24px 80px; }
  h1 { font-size: 28px; font-weight: 500; letter-spacing: -.02em; margin: 0 0 6px; }
  p.sub { color: #6F6F6F; margin: 0 0 32px; }
  .row { display: grid; gap: 24px; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 24px; }
  .row.two { grid-template-columns: repeat(2, minmax(0, 1fr)); max-width: 980px; }
  figure { margin: 0; }
  .box { position: relative; aspect-ratio: 1 / 1; border-radius: 24px; overflow: hidden; background: #E2E2E2; }
  .box video, .box img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  /* kartu cover meniru kartu dek di situs: gradasi gelap bawah + nama putih */
  .card::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(0deg, rgba(17,17,17,.62) 0%, rgba(17,17,17,.62) 17%, rgba(17,17,17,0) 38%); }
  .card span { position: absolute; left: 9%; bottom: 8.4%; z-index: 2; color: #fff; font-size: 16px; letter-spacing: -.01em; }
  figcaption { margin-top: 10px; font-size: 13px; color: var(--ink-3); }
  figcaption b { color: var(--ink); font-weight: 500; }
  @media (max-width: 900px) { .row, .row.two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>AI Headshots · demo</h1>
  <p class="sub">Semua video diputar berulang tanpa suara, sama seperti di situs.</p>
  <div class="row">
    <figure>
      <div class="box card">
        <video autoplay muted loop playsinline poster="../media/headshots-card-poster.webp">
          <source src="../media/headshots-card.webm" type="video/webm"><source src="../media/headshots-card.mp4" type="video/mp4">
        </video>
        <span>AI Headshots</span>
      </div>
      <figcaption><b>Cover kartu Home</b> · 1080², 8 detik, loop mulus</figcaption>
    </figure>
    <figure>
      <div class="box">
        <video autoplay muted loop playsinline poster="../media/headshots-media-01-poster.webp">
          <source src="../media/headshots-media-01.webm" type="video/webm"><source src="../media/headshots-media-01.mp4" type="video/mp4">
        </video>
      </div>
      <figcaption><b>Media 01 · desktop</b> · 1440², 29 detik, demo pemakaian dengan kursor</figcaption>
    </figure>
    <figure>
      <div class="box">
        <video autoplay muted loop playsinline poster="../media/headshots-media-02-poster.webp">
          <source src="../media/headshots-media-02.webm" type="video/webm"><source src="../media/headshots-media-02.mp4" type="video/mp4">
        </video>
      </div>
      <figcaption><b>Media 02 · mobile</b> · 1440², 19 detik, iPhone 390 x 844, demo pemakaian dengan ketukan</figcaption>
    </figure>
  </div>
  <div class="row two">
    <figure>
      <div class="box">
        <video autoplay muted loop playsinline poster="../media/headshots-media-03-poster.webp">
          <source src="../media/headshots-media-03.webm" type="video/webm"><source src="../media/headshots-media-03.mp4" type="video/mp4">
        </video>
      </div>
      <figcaption><b>Media 03 - landing desktop</b> - 1440², 19 detik, slider before after lalu scroll sampai footer</figcaption>
    </figure>
    <figure>
      <div class="box">
        <video autoplay muted loop playsinline poster="../media/headshots-media-04-poster.webp">
          <source src="../media/headshots-media-04.webm" type="video/webm"><source src="../media/headshots-media-04.mp4" type="video/mp4">
        </video>
      </div>
      <figcaption><b>Media 04 - landing mobile</b> - 1440², 19 detik, iPhone 390 x 844, slider before after lalu scroll</figcaption>
    </figure>
  </div>
</main>
</body>
</html>
